# Mosquitto config for the Unified Namespace broker.
# Open the broker beyond localhost so the App container (and any LAN client)
# can connect over the App Lab virtual network. Anonymous access is fine for an
# on-board demo; add password_file / ACLs if the board is on an untrusted net.
listener 1883 0.0.0.0
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
